<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EngageONE – Join the team</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#EFEAE2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111B21}
  .card{width:min(92vw,380px);background:#fff;border-radius:16px;padding:32px 28px;box-shadow:0 8px 30px rgba(7,94,84,.15)}
  h1{margin:0 0 6px;font-size:22px;color:#075E54} h1 span{color:#25D366}
  p{margin:0 0 20px;color:#667781;font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:12px;border:1px solid #cfd8d6;border-radius:8px;font-size:16px;margin-bottom:14px}
  button{width:100%;padding:12px;border:0;border-radius:8px;background:#075E54;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  button:hover{background:#128C7E}
  .err{color:#b3261e;font-size:14px;margin-top:12px}
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>Engage<span>ONE</span></h1>
    <p id="msg">Checking your invite…</p>
    <div id="fields" hidden>
      <label>Email</label><input id="em" disabled>
      <label for="pw">Choose a password (8+ characters)</label>
      <input id="pw" type="password" minlength="8" autocomplete="new-password" required>
      <button>Join the team</button>
    </div>
    <div class="err" id="err"></div>
  </form>
<script>
const t = new URLSearchParams(location.search).get('t') || '';
const $ = id => document.getElementById(id);
fetch('/api/accept-invite?t=' + encodeURIComponent(t)).then(async r => {
  const d = await r.json();
  if (!r.ok) { $('msg').textContent = d.error; return; }
  $('msg').textContent = 'You are invited. Set your password to start.';
  $('em').value = d.email; $('fields').hidden = false;
});
$('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/accept-invite', { method: 'POST', body: JSON.stringify({ token: t, password: $('pw').value }) });
  const d = await r.json();
  if (r.ok) location.href = '/uc/'; else $('err').textContent = d.error;
};
</script>
</body>
</html>
