<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Admin – EngageONE</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#EFEAE2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111B21}
  header{background:#075E54;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
  header b{font-size:18px} header b span{color:#25D366}
  header a{color:#D9FDD3;font-size:14px;text-decoration:none;margin-left:16px}
  main{max-width:760px;margin:0 auto;padding:32px 20px 60px}
  h1{margin:0 0 6px;color:#075E54}
  .sub{margin:0 0 24px;color:#667781}
  .box{background:#fff;border-radius:14px;padding:22px;box-shadow:0 4px 16px rgba(7,94,84,.12);margin-bottom:22px}
  h2{margin:0 0 14px;font-size:18px;color:#075E54}
  form{display:flex;gap:10px;flex-wrap:wrap}
  input{flex:1;min-width:220px;padding:11px;border:1px solid #cfd8d6;border-radius:8px;font-size:15px}
  button{border:0;border-radius:8px;background:#075E54;color:#fff;font-weight:600;font-size:14px;padding:11px 18px;cursor:pointer}
  button:hover{background:#128C7E}
  button.del{background:#fff;color:#b3261e;border:1px solid #e3c4c1;padding:6px 12px;font-size:13px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #eef1f0;font-size:15px}
  .row small{color:#667781;display:block}
  .empty{color:#667781;font-size:14px}
  .link{margin-top:14px;padding:12px;border-radius:8px;background:#D9FDD3;font-size:14px;word-break:break-all}
  .link button{margin-top:8px}
  .err{color:#b3261e;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<header><b>Engage<span>ONE</span></b><span><a href="/uc/">Use cases</a><a href="/logout">Sign out</a></span></header>
<main>
  <h1>Admin</h1>
  <p class="sub">Invite your team so they can run the demos.</p>

  <div class="box">
    <h2>Invite a team member</h2>
    <form id="inv"><input id="email" type="email" placeholder="name@company.com" required><button>Create invite link</button></form>
    <div id="out"></div>
  </div>

  <div class="box"><h2>Pending invites</h2><div id="invites"></div></div>
  <div class="box"><h2>Team</h2><div id="users"></div></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load() {
  const r = await fetch('/api/admin/team'); const d = await r.json();
  if (!r.ok) { $('out').innerHTML = `<div class="err">${esc(d.error || 'Could not load.')}</div>`; return; }
  const day = t => new Date(t).toLocaleDateString();
  $('invites').innerHTML = d.invites.length ? d.invites.map(i => `<div class="row"><div>${esc(i.email)}<small>Invited ${day(i.created)} · link works for 7 days</small></div><button class="del" data-inv="${i.token}">Cancel</button></div>`).join('') : '<div class="empty">No pending invites.</div>';
  $('users').innerHTML = d.users.length ? d.users.map(u => `<div class="row"><div>${esc(u.email)}<small>Joined ${day(u.created)}</small></div><button class="del" data-user="${esc(u.email)}">Remove</button></div>`).join('') : '<div class="empty">No team members yet.</div>';
}
$('inv').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/admin/team', { method: 'POST', body: JSON.stringify({ email: $('email').value }) });
  const d = await r.json();
  if (!r.ok) { $('out').innerHTML = `<div class="err">${esc(d.error)}</div>`; return; }
  $('out').innerHTML = `<div class="link">Send this link to <b>${esc(d.email)}</b>:<br><span id="lk">${esc(d.link)}</span><br><button id="cp" type="button">Copy link</button></div>`;
  $('cp').onclick = () => { navigator.clipboard.writeText(d.link); $('cp').textContent = 'Copied ✓'; };
  $('email').value = ''; load();
};
document.addEventListener('click', async e => {
  const b = e.target.closest('button.del'); if (!b) return;
  if (b.dataset.user && !confirm('Remove ' + b.dataset.user + '? They lose access now.')) return;
  await fetch('/api/admin/team?' + (b.dataset.user ? 'email=' + encodeURIComponent(b.dataset.user) : 'invite=' + b.dataset.inv), { method: 'DELETE' });
  load();
});
load();
</script>
</body>
</html>
