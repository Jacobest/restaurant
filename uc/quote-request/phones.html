<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<title>EngageONE – Quote Request phone chat screens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#F0F7F2;color:#111B21;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .page{max-width:1400px;margin:0 auto;padding:32px 16px 48px}
  .h1{font-size:clamp(28px,5vw,46px);line-height:1.05;margin:0}
  .sub{font-size:clamp(16px,2.6vw,22px)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px 16px;justify-items:center}
  @media (max-width:700px){.grid{grid-template-columns:1fr}}
  .crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:14px 24px;background:#fff;border-bottom:1px solid #d5e3dc;font-family:inherit;font-weight:600;font-size:17px;line-height:1.2}
  .crumbs[hidden]{display:none}
  .crumbs a{color:#075E54;text-decoration:none}
  .crumbs a:hover{text-decoration:underline}
  .crumbs .back{background:#075E54;color:#fff;padding:8px 14px;border-radius:99px;font-size:15px;margin-right:6px}
  .crumbs .back:hover{background:#128C7E;text-decoration:none}
  .crumbs .sep{color:#8aa39b;font-weight:400}
  .crumbs .cur{color:#111B21}
  @media (max-width:600px){.crumbs{padding:12px 16px;font-size:16px}}
  header.site{background:#075E54;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header.site b{font-size:18px} header.site b span{color:#25D366}
  header.site a{color:#D9FDD3;font-size:14px;text-decoration:none}
  header.site .hl{display:flex;align-items:center;gap:14px}
  header.site .demo{font-size:18px;color:#D9FDD3;padding-left:14px;border-left:1px solid rgba(255,255,255,.35);white-space:nowrap}
  header.site .demo strong{font-weight:700;color:#fff}
</style>
</head>
<body>
<header class="site"><div class="hl"><b>Engage<span>ONE</span></b><span class="demo">Quotes <strong>Demo</strong></span></div><a href="/logout">Sign out</a></header>
<nav class="crumbs" aria-label="Breadcrumb"><a class="back" href="/uc/quote-request/">‹ Back</a><a href="/uc/">Use cases</a> <span class="sep">›</span> <a href="/uc/quote-request/">Quote Request</a> <span class="sep">›</span> <span class="cur">Phone chat screens</span></nav>
<div id="root"></div>
<script>
const SERIF = "'Cormorant Garamond',Georgia,serif";
function buildPhones() {
  const T = { head: '#075E54', teal: '#128C7E', green: '#25D366', out: '#D9FDD3', bg: '#EFEAE2', ink: '#111B21', mute: '#667781', link: '#027EB5', tick: '#53BDEB' };
  const time = t => `<span style="float:right;margin:4px 0 0 8px;font-size:8.5px;color:${T.mute}">${t}</span>`;
  const tickTime = t => `<span style="float:right;margin:4px 0 0 8px;font-size:8.5px;color:${T.mute}">${t} <span style="color:${T.tick}">✓✓</span></span>`;
  const bub = (side, html, t) => `<div style="align-self:${side === 'in' ? 'flex-start' : 'flex-end'};max-width:80%;background:${side === 'in' ? '#fff' : T.out};border-radius:${side === 'in' ? '2px 9px 9px 9px' : '9px 2px 9px 9px'};padding:6px 8px 4px;font-size:11px;line-height:1.35;color:${T.ink};box-shadow:0 1px 0.5px rgba(11,20,26,0.13)">${html}<div style="overflow:hidden">${side === 'in' ? time(t) : tickTime(t)}</div></div>`;
  const I = (h, t = '19:02') => bub('in', h, t), O = (h, t = '19:03') => bub('out', h, t);
  const btns = a => `<div style="align-self:flex-start;width:80%;display:flex;flex-direction:column;gap:3px;margin-top:-3px">${a.map(b => `<div style="background:#fff;border-radius:9px;text-align:center;padding:7px;font-size:11px;font-weight:500;color:${T.link};box-shadow:0 1px 0.5px rgba(11,20,26,0.13)">${b}</div>`).join('')}</div>`;
  const chip = t => `<div style="align-self:center;background:#E1F2FB;color:${T.mute};font-size:9.5px;padding:3px 9px;border-radius:7px;box-shadow:0 1px 0.5px rgba(11,20,26,0.1)">${t}</div>`;
  const row = (a, b, bold) => `<div style="display:flex;justify-content:space-between;${bold ? 'font-weight:700;border-top:1px solid #dfe5e7;margin-top:3px;padding-top:3px' : ''}"><span>${a}</span><span>${b}</span></div>`;
  const steps = [
    ['Describe the problem', [chip('Today'), O('Hi, my geyser is leaking in the ceiling. Can you quote?'), I('Welcome to <b>Cape Plumbing & Drainage</b> 🔧<br>Sorry to hear that. Let’s get you sorted. Can you send me a few photos of the geyser and the leak?'), btns(['Send photos', 'Call me instead'])]],
    ['Photos, suburb and urgency', [O('Send photos'), I('Please send up to 5 photos 📷'), O('📷 3 photos', '08:14'), I('Thanks, I can see the geyser and the water stain. Which suburb are you in?', '08:14'), O('Observatory, Cape Town', '08:15'), I('How urgent is it?', '08:15'), btns(['Burst or flooding now', 'Today or tomorrow', 'This week', 'Just planning']), O('Today or tomorrow', '08:15')]],
    ['Rough call-out range', [I('Thank you, Naledi. For a leaking geyser in Observatory, the site visit and assessment usually costs <b>R650 to R950</b>.<br>The final price depends on the geyser size and the work needed. You get a formal quote after the visit, and there is no obligation to accept it.', '08:16'), btns(['Book a site visit', 'Ask a question']), O('Book a site visit', '08:17')]],
    ['Book the site visit', [I('Which day suits you?', '08:17'), btns(['Tomorrow, Tue 10/11', 'Wed 11/11', 'Thu 12/11']), O('Tomorrow, Tue 10/11', '08:18'), I('Free arrival windows:', '08:18'), btns(['09:00 – 11:00', '13:00 – 15:00']), O('09:00 – 11:00', '08:18'), I('<b>Site visit booked</b>' + [['Name', 'Naledi Khumalo'], ['Address', 'Observatory, Cape Town'], ['Job', 'Leaking geyser'], ['Date', '10/11/2026'], ['Window', '09:00 – 11:00'], ['Call-out fee', 'R650 – R950', true]].map(([a, b, bold]) => row(a, b, bold)).join('')), btns(['Confirm', 'Change']), O('Confirm', '08:19'), I('✅ <b>Booked!</b><br>Ref: CPD-2026-0412<br>Sipho, our technician, will message you when he is on his way.', '08:19')]],
    ['After the visit', [chip('Tue 10/11/2026'), I('Hi Naledi, Sipho is 20 minutes away 🚗', '08:40'), O('Great, I’m home', '08:41'), chip('Later that day'), I('Thanks for having us today. Sipho has sent his measurements and notes. Our office is preparing your formal quote and will send it here, usually within 24 hours.', '13:05')]],
    ['The quote arrives', [chip('Wed 11/11/2026'), I('Your quote is ready 📄<br><b>Quote Q-0412</b><br>Replace 150 L geyser, new pressure valve and drip tray', '09:30'), I('📎 Quote-Q-0412.pdf · 2 pages', '09:30'), I('<b>Quote summary</b>' + [['Geyser and valve', 'R5 450.00'], ['Labour', 'R1 400.00'], ['Total incl. VAT', 'R6 850.00', true], ['Deposit (30%)', 'R2 055.00']].map(([a, b, bold]) => row(a, b, bold)).join('') + '<br>Valid until 25/11/2026.', '09:30'), btns(['Accept quote', 'Ask a question', 'Not now']), O('Accept quote', '10:02')]],
    ['Deposit and scheduling', [I('Thank you! To book the work, please pay the <b>R2 055.00</b> deposit. The balance is due when the job is done.', '10:02'), btns(['Pay deposit now']), O('Pay deposit now', '10:03'), I('🔒 Secure payment link: pay.example.co.za/cpd-0412', '10:03'), chip('Payment received'), I('✅ Deposit received, thank you!<br><b>Job scheduled:</b> Fri 13/11/2026, 08:00, Sipho and one assistant. Please clear access to the geyser. A tax invoice has been emailed to you.', '10:05')]],
    ['After the job', [chip('Fri 13/11/2026'), I('Your new geyser is in, and the job is signed off ✅ Thank you for choosing <b>Cape Plumbing & Drainage</b>. How was our service? (1–5)', '14:30'), O('5 – Sipho was brilliant, no mess at all', '15:10'), I('That is wonderful to hear! Would you share it as a Google review? It helps other homeowners find us.', '15:10'), btns(['Leave a Google review', 'Maybe later']), O('Leave a Google review', '15:11'), I('Thank you, Naledi! Your 12-month workmanship cover is on your invoice. Message us any time 💙', '15:11')]],
  ];
  const phone = ([title, msgs], i) => `<div style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <div style="display:flex;align-items:center;gap:10px;align-self:center"><div style="width:32px;height:32px;border-radius:50%;background:${T.head};color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center">${i + 1}</div><div style="font-family:${SERIF};font-weight:600;font-size:24px;color:${T.head}">${title}</div></div>
    <div style="position:relative;width:300px;height:620px;border-radius:48px;background:linear-gradient(145deg,#2e2e2e,#0a0a0a 60%,#1c1c1c);padding:9px;box-sizing:border-box;box-shadow:0 0 0 1.5px #3a3a3a inset,0 18px 36px rgba(0,0,0,.35)">
      <div style="position:absolute;left:-3px;top:110px;width:3px;height:30px;background:#1a1a1a;border-radius:2px 0 0 2px"></div><div style="position:absolute;left:-3px;top:160px;width:3px;height:52px;background:#1a1a1a;border-radius:2px 0 0 2px"></div><div style="position:absolute;right:-3px;top:170px;width:3px;height:76px;background:#1a1a1a;border-radius:0 2px 2px 0"></div>
      <div style="position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:${T.bg};display:flex;flex-direction:column">
        <div style="background:${T.head};color:#fff;padding:10px 20px 8px;flex:none"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:600;padding:0 6px"><span>9:41</span><span style="letter-spacing:2px">▂▄▆ ▮</span></div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:20px"><span style="font-size:16px">‹</span><div style="width:30px;height:30px;border-radius:50%;background:${T.green};display:flex;align-items:center;justify-content:center;font-size:14px">📋</div><div style="line-height:1.2"><div style="font-size:12.5px;font-weight:600">Cape Plumbing & Drainage <span style="color:${T.green}">✔</span></div><div style="font-size:9.5px;opacity:.8">Business account</div></div></div></div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;padding:10px 8px;overflow:hidden;background-image:radial-gradient(rgba(7,94,84,.07) 1px,transparent 1px);background-size:14px 14px">${msgs.join('')}</div>
        <div style="flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px 20px;background:${T.bg}"><div style="flex:1;background:#fff;border-radius:18px;padding:7px 12px;font-size:11px;color:${T.mute}">Message</div><div style="width:30px;height:30px;border-radius:50%;background:${T.teal};color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">🎤</div></div>
        <div style="position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:100px;height:4px;border-radius:2px;background:#111"></div>
        <div style="position:absolute;top:9px;left:50%;transform:translateX(-50%);width:84px;height:24px;border-radius:14px;background:#000"></div>
      </div></div></div>`;
  return `<div class="page">
    <div style="font-family:${SERIF};font-weight:600;color:${T.head}" class="h1">Customer Journey – WhatsApp Quotes</div>
    <div style="font-family:${SERIF};font-style:italic;margin-top:6px" class="sub">Cape Plumbing & Drainage · The eight steps as the customer sees them</div>
    <div style="height:1px;background:${T.teal};margin:24px 0 36px"></div>
    <div class="grid">${steps.map(phone).join('')}</div></div>`;
}


document.getElementById('root').innerHTML = buildPhones();
</script>
</body>
</html>
