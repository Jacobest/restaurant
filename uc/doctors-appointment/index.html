<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor's Appointment – EngageONE</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#EFEAE2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111B21}
  header{background:#075E54;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
  header b{font-size:18px}
  header b span{color:#25D366}
  header a{color:#D9FDD3;font-size:14px;text-decoration:none;margin-left:16px}
  main{max-width:900px;margin:0 auto;padding:32px 20px 60px}
  .crumb{font-size:14px;margin-bottom:14px}
  .crumb a{color:#128C7E;text-decoration:none}
  h1{margin:0 0 8px;color:#075E54}
  .lead{color:#444;line-height:1.6;max-width:680px}
  .soon{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:10px;background:#fff;color:#667781}
</style>
</head>
<body>
<header><b>Engage<span>ONE</span></b><span><a href="/uc/">All use cases</a><a href="/logout">Sign out</a></span></header>
<main>
  <div class="crumb"><a href="/uc/">Use cases</a> / Doctor's Appointment</div>
  <h1>Doctor's Appointment</h1>
  <p class="lead">Patients book, change or cancel a visit in chat and get reminders before the appointment.</p>
  <div class="soon">The demos for this use case are coming soon.</div>
</main>
<script>fetch("/api/me").then(r=>r.json()).then(d=>{if(d.role==="owner"){const n=document.querySelector("header a[href=\"/logout\"]");if(n)n.insertAdjacentHTML("beforebegin","<a href=\"/admin/\">Admin</a>")}})</script>
</body>
</html>
