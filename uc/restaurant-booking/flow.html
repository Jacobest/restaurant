<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>EngageONE – Guest Journey – WhatsApp Reservations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
  body{margin:0;background:#DCE8E0;color:#111B21;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .bar{position:sticky;top:0;left:0;z-index:10;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#F0F7F2;border-bottom:1px solid #128C7E;font-size:13px}
  .bar label{display:flex;gap:6px;align-items:center}
  .bar select,.bar input{accent-color:#075E54}
  #stage{transform-origin:0 0}
  #wrap{overflow:hidden}
</style>
</head>
<body>
<div class="bar">
  <label>View <select id="view"><option>Full diagram</option><option>Owner's view</option><option>Phone view</option></select></label>
  <label><input type="checkbox" id="exc" checked> Show exceptions</label>
  <label><input type="checkbox" id="badges" checked> Show badges</label>
  <a href="phones.html" style="color:#075E54;font-weight:600">Phone view page (mobile) →</a>
  <label>Zoom <input type="range" id="zoom" min="20" max="100" value="40"></label>
</div>
<div id="wrap"><div id="stage"></div></div>
<script>
const $ = id => document.getElementById(id);
const C = { wine: '#075E54', gold: '#128C7E', sage: '#34B7F1', char: '#111B21', mute: '#667781' };
const SERIF = "'Cormorant Garamond',Georgia,serif";
const BADGE = 'background:#111B21;color:#F0F7F2;font-size:8px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px';
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function buildFull(showBadges, showExc) {
  const P = 180, W = 140, X0 = 150, LH = 200, BT = [170, 1270], ST = 14, CW = 4330, CH = 2310;
  const H = { cust: 66, proc: 66, msg: 66, dec: 86, db: 66, ref: 60, offline: 66, start: 52, end: 52, note: 76 };
  const WD = { dec: 164, start: 52, end: 52 };
  const STY = { cust: [C.wine, '#FFFFFF'], proc: [C.char, '#FFFFFF'], msg: [C.char, '#FFFFFF'], dec: [C.gold, '#D9FDD3'], db: [C.sage, '#DDF1FA'], ref: [C.gold, '#C8EBD5'], offline: [C.mute, 'transparent'], start: [C.wine, C.wine], end: [C.char, C.char], note: ['transparent', 'transparent'] };
  // [id,type,band,lane,col,row,title,sub,badge,exception]
  const defs = [
    ['start','start',0,0,0,0,'Start','Guest opens the chat'],
    ['entry','note',0,0,0,1,'Entry points','Click-to-WhatsApp link (website · Instagram · Google), QR code on estate signage, or a direct message'],
    ['welcome','msg',0,1,1,0,'Branded welcome','Book · Menu · Manage booking · Speak to a person','Buttons'],
    ['menu','msg',0,1,1,1,'Online menu','Dishes & estate wines','Link'],
    ['tap','cust',0,0,1,0,'Guest taps a button'],
    ['which','dec',0,1,2,0,'Which button?'],
    ['staff','proc',0,3,2,0,'Host / staff takes over the chat','Escape hatch — available at every stage'],
    ['manageRef','ref',0,1,3,1,'Manage my booking','→ Stage 5'],
    ['date','cust',0,0,3,0,'Date','DD/MM/YYYY date picker','Flow form'],
    ['period','cust',0,0,4,0,'Meal period','Breakfast · Lunch · Dinner','Buttons'],
    ['time','cust',0,0,5,0,'Preferred time','Slots within the period · none after last seating 20:30','List'],
    ['diners','cust',0,0,6,0,'Number of diners','1–12 · More than 12','List'],
    ['big','dec',0,0,7,0,'More than 12 guests?'],
    ['events','proc',0,3,7,0,'Events coordinator','Group / event enquiry flagged · replies within [X h] · Private setting (max 12) not offered',null,1],
    ['eventsEnd','end',0,3,8,0,'End','Handled by events team',null,1],
    ['area','cust',0,0,8,0,'Dining area','Private (≤12 only) · Main · Mezzanine · Alfresco · No preference','List'],
    ['diet','cust',0,0,9,0,'Dietary needs','None · Vegetarian · Vegan · Gluten-free · Allergies (free text) · Other','List'],
    ['occasion','cust',0,0,10,0,'Special occasion?','Birthday, anniversary… optional','Buttons'],
    ['preorder','dec',0,0,11,0,'Pre-order?','Yes · No · Decide later','Buttons'],
    ['menuFlow','msg',0,1,11,1,'Pre-order menu','Dishes per guest · optional wine pairing · summary attached','Flow form'],
    ['menuDb','db',0,2,11,1,'Online menu & wine pairing'],
    ['timeout','proc',0,1,9,1,'No reply mid-booking','Gentle nudge after [X min] · then table hold released',null,1],
    ['timeoutEnd','end',0,1,10,1,'End','Session closed',null,1],
    ['query','proc',0,1,12,0,'Check availability','date · time · party size · area · table size'],
    ['resDb','db',0,2,12,0,'Reservation / dining-plan system','API'],
    ['avail','dec',0,2,13,0,'Available?'],
    ['hold','proc',0,2,14,0,'Hold the table','[10 min, adjustable]'],
    ['alts','proc',0,1,13,1,'Propose alternatives, in order','a) same time, other area · b) same area, nearest slot · c) other date · d) waitlist',null,1],
    ['accept','dec',0,0,13,1,'Guest accepts an alternative?',null,null,1],
    ['close','msg',0,0,14,1,'Polite close','Try again (→ Stage 2) or speak to a person',null,1],
    ['summary','msg',0,1,15,0,'Booking summary','Date · time · area · guests · dietary · pre-order & pairing','Buttons'],
    ['confirm','cust',0,0,15,0,'Taps Confirm'],
    ['deposit','dec',0,1,16,0,'Deposit required?','Large / private [adj]'],
    ['depPay','proc',0,4,16,0,'Deposit via secure payment link',null,'Link'],
    ['write','proc',0,2,17,0,'Write booking to reservation system'],
    ['confMsg','msg',0,1,17,0,'Confirmation','Booking ref · map pin · Add to calendar · Manage booking','Buttons'],
    ['reminders','msg',0,1,18,0,'Reminders','24 h and 2 h before · pre-order link if “Decide later”','Template · Utility'],
    ['dineRef','ref',0,3,18,0,'Booking day','→ Dine (Stage 6, band 2)'],
    ['manageTap','cust',0,0,18,0,'Taps Manage booking','Any time before arrival'],
    ['what','dec',0,0,19,0,'What would you like to change?'],
    ['rebookRef','ref',0,0,20,1,'Rebook / change date or time','→ Stage 2, details pre-filled'],
    ['lateDec','dec',0,1,20,0,'More than 60 min before booking?'],
    ['release','proc',0,2,21,0,'Cancel booking & release table'],
    ['cancelMsg','msg',0,1,22,0,'Cancellation confirmed','Rebook button','Buttons'],
    ['lateStaff','proc',0,3,20,0,'Handover to staff','Cannot cancel via WhatsApp inside 60 min',null,1],
    ['addCheck','proc',0,2,20,1,'Re-check availability for party +1','Same table / area · max +1 diner'],
    ['addAvail','dec',0,2,21,1,'Available?'],
    ['updated','msg',0,1,22,1,'Booking updated & confirmed',null,'Buttons'],
    ['altRef','ref',0,3,21,1,'Propose alternative','→ Stage 3 logic',null,1],
    ['fromRef','ref',1,0,0,0,'From Confirm','Stage 4, band 1'],
    ['dine','offline',1,3,0,0,'Guests arrive, are seated and enjoy the meal','On site — offline'],
    ['closeBill','proc',1,3,1,0,'Staff closes the bill in POS'],
    ['posDb','db',1,4,1,0,'POS'],
    ['bill','msg',1,1,2,0,'Itemised bill','Food · wine · pairings · ZAR','Template · Utility'],
    ['payWA','dec',1,0,3,0,'Pay via WhatsApp?',null,'Buttons'],
    ['tip','cust',1,0,4,0,'Choose a tip','10% · 12.5% · 15% · custom · none','List'],
    ['gateway','db',1,4,2,1,'Payment gateway'],
    ['payLink','proc',1,4,4,0,'Secure payment link / in-chat payment',null,'Link'],
    ['paySuccess','dec',1,4,5,0,'Payment successful?'],
    ['failed','msg',1,1,5,1,'Payment failed','Retry, or pay at the table',null,1],
    ['atTable','proc',1,3,3,1,'Pays at the table','Card or cash · standard payment'],
    ['staffMark','proc',1,4,3,1,'Staff marks bill paid in POS'],
    ['paid','proc',1,4,6,1,'Bill settled in POS','Both payment routes merge here'],
    ['receipt','msg',1,1,7,0,'Receipt + 2-question survey',null,'Template · Utility'],
    ['q1','cust',1,0,8,0,'Q1 Rate your experience','1–5 · 5 = Excellent, 1 = Poor','List'],
    ['q2','cust',1,0,9,0,'Q2 One thing we did well and/or one thing we can improve',null,'Free text'],
    ['rating','dec',1,1,10,0,'Rating?'],
    ['alertMgr','proc',1,3,10,0,'Manager alerted','Personal follow-up with the guest',null,1],
    ['mgrEnd','end',1,3,11,0,'End','Personal follow-up',null,1],
    ['review','msg',1,1,11,0,'Invite to leave a Google review','[adjustable]','Link'],
    ['rewards','dec',1,0,12,0,'Join the rewards programme?',null,'Buttons'],
    ['special','dec',1,0,13,0,'Special-day reminders?',null,'Buttons'],
    ['occasions','cust',1,0,14,0,'Occasions & dates','Birthday · anniversary · Mother’s / Father’s Day · Valentine’s…','Flow form'],
    ['crm','db',1,4,14,0,'CRM / rewards database','Explicit consent (POPIA) · Stop / Unsubscribe at any time'],
    ['specialMsg','msg',1,1,15,1,'Special-day reminder','[14 days before, adjustable]','Template · Marketing'],
    ['bookRef','ref',1,0,16,1,'Book a table','→ Stage 2 — loop closed'],
    ['thanks','msg',1,1,15,0,'Thank you & close','Stop / Unsubscribe available at any time'],
    ['endNode','end',1,1,16,0,'End','Journey complete'],
  ];
  const N = {}, nodes = [];
  defs.forEach(([id, type, b, lane, col, row, title, sub, badge, exc]) => {
    const w = WD[type] || W, h = H[type], cx = X0 + col * P + W / 2, cy = BT[b] + lane * LH + (row ? 141 : 53);
    const [bc, bg] = STY[type];
    const n = { id, type, x: cx - w / 2, y: cy - h / 2, w, h, cx, cy, title, sub: sub || '', badge: badge || '', showBadge: !!badge && showBadges, exc: !!exc, bc: exc ? C.mute : bc, bg };
    N[id] = n; if (showExc || !exc) nodes.push(n);
  });
  const gapY = (b, l) => BT[b] + l * LH + 97;
  const yTop0 = BT[0] + 53, chanB = BT[1] + 12;
  // [from,to,fromSide,toSide,kind,label,via,labelSegment]
  const E = [
    ['start','welcome','r','l','happy'], ['welcome','tap','t','b','happy'], ['tap','which','r','l','happy'],
    ['which','date','r','l','happy','Book a table'],
    ['which','staff','b','t','normal','Speak to a person',null,1],
    ['which','menu','b','t','normal','View menu',[[N.which.cx, gapY(0,1)],[N.menu.cx, gapY(0,1)]],2],
    ['which','manageRef','b','l','normal','Manage my booking',[[N.which.cx, N.manageRef.cy]],2],
    ['menu','welcome','t','b','muted','back'],
    ['date','period','r','l','happy'], ['period','time','r','l','happy'], ['time','diners','r','l','happy'], ['diners','big','r','l','happy'],
    ['big','area','r','l','happy','No'], ['big','events','b','t','normal','Yes — 12+ guests',null,1], ['events','eventsEnd','r','l','muted'],
    ['area','diet','r','l','happy'], ['diet','occasion','r','l','happy'], ['occasion','preorder','r','l','happy'],
    ['preorder','query','r','l','happy','No · Decide later',null,3],
    ['preorder','menuFlow','b','t','normal','Yes',null,1], ['menuFlow','menuDb','b','t','normal'], ['menuFlow','query','r','l','normal'],
    ['diet','timeout','b','t','sched','no reply',null,1], ['timeout','timeoutEnd','r','l','muted'],
    ['query','resDb','b','t','happy'], ['resDb','avail','r','l','happy'], ['avail','hold','r','l','happy','Yes'],
    ['avail','alts','t','b','muted','No',null,1], ['alts','accept','t','b','muted','guest picks one',null,1],
    ['accept','query','t','t','muted','Yes — re-check (loops until accepted or declined)',[[N.accept.cx, yTop0],[N.query.cx, yTop0]],2],
    ['accept','close','r','l','muted','No'],
    ['hold','summary','r','l','happy'], ['summary','confirm','t','b','happy'], ['confirm','deposit','r','l','happy'],
    ['deposit','depPay','b','t','normal','Yes',null,1], ['depPay','write','r','l','normal','paid'], ['deposit','write','r','l','happy','No'],
    ['write','confMsg','t','b','happy'], ['confMsg','reminders','r','l','sched','scheduled'], ['reminders','dineRef','b','t','sched','booking day',null,1],
    ['confMsg','manageTap','t','l','normal','Manage booking',null,2], ['manageTap','what','r','l','normal'],
    ['what','lateDec','r','l','normal','Cancel'],
    ['what','rebookRef','b','l','normal','Rebook / change',[[N.what.cx, N.rebookRef.cy]],2],
    ['what','addCheck','b','l','normal','Add a diner (max +1)',[[N.what.cx, N.addCheck.cy]],2],
    ['lateDec','release','r','l','normal','Yes'], ['release','cancelMsg','r','l','normal'], ['lateDec','lateStaff','b','t','muted','No',null,1],
    ['addCheck','addAvail','r','l','normal'], ['addAvail','updated','r','l','normal','Yes'], ['addAvail','altRef','b','t','muted','No',null,1],
    ['fromRef','dine','b','t','normal','guest arrives',null,1], ['dine','closeBill','r','l','happy'], ['closeBill','posDb','b','t','happy'], ['posDb','bill','r','l','happy'],
    ['bill','payWA','t','l','happy'], ['payWA','tip','r','l','happy','Yes'], ['tip','payLink','b','t','happy'],
    ['payLink','gateway','l','t','normal'], ['payLink','paySuccess','r','l','happy'], ['paySuccess','paid','r','l','happy','Yes'],
    ['paySuccess','failed','t','b','muted','No',null,1], ['failed','tip','t','r','muted','retry',null,1], ['failed','paid','r','t','muted','pays at table',null,1],
    ['payWA','atTable','b','t','normal','No',null,1], ['atTable','staffMark','b','t','normal'], ['staffMark','paid','r','l','normal'],
    ['paid','receipt','r','l','happy'], ['receipt','q1','t','l','happy'], ['q1','q2','r','l','happy'], ['q2','rating','r','l','happy'],
    ['rating','alertMgr','b','t','muted','1–2',null,1], ['alertMgr','mgrEnd','r','l','muted'], ['rating','review','r','l','normal','4–5'],
    ['review','rewards','r','l','happy'], ['rating','rewards','t','l','normal','3',null,1],
    ['rewards','special','r','l','happy','Yes / No'], ['rewards','crm','b','l','normal','Yes — consent recorded',null,2],
    ['special','occasions','r','l','happy','Yes'],
    ['special','thanks','t','t','muted','No',[[N.special.cx, chanB],[N.thanks.cx, chanB]],2],
    ['occasions','crm','b','t','normal','dates stored',null,1], ['occasions','thanks','r','l','happy'],
    ['crm','specialMsg','r','l','sched','scheduled · 14 days before'], ['specialMsg','bookRef','r','l','sched'], ['thanks','endNode','r','l','happy'],
  ];
  const K = { happy: [C.wine, 2.4, ''], normal: [C.char, 1.3, ''], muted: [C.mute, 1.3, ''], sched: [C.gold, 1.5, '6 4'] };
  const anchor = (n, s) => s === 'r' ? { x: n.x + n.w, y: n.cy } : s === 'l' ? { x: n.x, y: n.cy } : s === 't' ? { x: n.cx, y: n.y } : { x: n.cx, y: n.y + n.h };
  const stub = (pt, s) => s === 'r' ? { x: pt.x + ST, y: pt.y } : s === 'l' ? { x: pt.x - ST, y: pt.y } : s === 't' ? { x: pt.x, y: pt.y - ST } : { x: pt.x, y: pt.y + ST };
  let els = '', labels = '';
  E.forEach(([f, t, fs, ts, kind, label, via, lseg]) => {
    const a = N[f], b = N[t];
    if (!showExc && (kind === 'muted' || a.exc || b.exc)) return;
    const pa = anchor(a, fs), pb = anchor(b, ts), p0 = stub(pa, fs), p1 = stub(pb, ts);
    let pts = [pa, p0];
    if (via) via.forEach(([x, y]) => pts.push({ x, y }));
    else {
      const hf = fs === 'l' || fs === 'r', ht = ts === 'l' || ts === 'r';
      if (hf && ht) { const mx = (p0.x + p1.x) / 2; pts.push({ x: mx, y: p0.y }, { x: mx, y: p1.y }); }
      else if (!hf && !ht) { const my = (p0.y + p1.y) / 2; pts.push({ x: p0.x, y: my }, { x: p1.x, y: my }); }
      else if (hf) pts.push({ x: p1.x, y: p0.y });
      else pts.push({ x: p0.x, y: p1.y });
    }
    pts.push(p1, pb);
    pts = pts.filter((q, j) => j === 0 || Math.abs(q.x - pts[j - 1].x) > 0.5 || Math.abs(q.y - pts[j - 1].y) > 0.5);
    const dist = (u, v) => Math.hypot(u.x - v.x, u.y - v.y);
    const toward = (from, to, r) => { const d = dist(from, to) || 1; return { x: from.x + (to.x - from.x) * r / d, y: from.y + (to.y - from.y) * r / d }; };
    let d = `M${pts[0].x} ${pts[0].y}`;
    for (let j = 1; j < pts.length - 1; j++) {
      const q = pts[j], r = Math.min(8, dist(pts[j - 1], q) / 2, dist(q, pts[j + 1]) / 2);
      const s1 = toward(q, pts[j - 1], r), s2 = toward(q, pts[j + 1], r);
      d += ` L${s1.x} ${s1.y} Q${q.x} ${q.y} ${s2.x} ${s2.y}`;
    }
    d += ` L${pts[pts.length - 1].x} ${pts[pts.length - 1].y}`;
    const [col, sw, dash] = K[kind];
    els += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${sw}" ${dash ? `stroke-dasharray="${dash}"` : ''} marker-end="url(#ar-${kind})" stroke-linecap="round"/>`;
    if (label) {
      let seg = lseg ?? (pts.length >= 5 ? 2 : 1); seg = Math.min(seg, pts.length - 2);
      const u = pts[seg], v = pts[seg + 1];
      const horiz = Math.abs(u.y - v.y) < 1;
      const mx = (u.x + v.x) / 2, my = (u.y + v.y) / 2;
      const tw = label.length * 5.2 + 10;
      const shortGap = horiz && Math.abs(v.x - u.x) < 40;
      const lx = horiz ? mx - tw / 2 : mx + 6, ly = horiz ? (shortGap ? my - 30 : my - 18) : my - 7;
      labels += `<g><rect x="${lx}" y="${ly}" width="${tw}" height="14" rx="7" fill="#F0F7F2" stroke="${col}" stroke-width="0.6"/><text x="${lx + tw / 2}" y="${ly + 10}" font-size="9" font-family="Inter, system-ui, sans-serif" font-weight="600" fill="${kind === 'muted' ? '#54656F' : C.char}" text-anchor="middle">${esc(label)}</text></g>`;
    }
  });
  const markers = Object.entries(K).map(([k, [col]]) => `<marker id="ar-${k}" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 z" fill="${col}"/></marker>`).join('');
  const svgStyle = `position:absolute;left:0;top:0;width:${CW}px;height:${CH}px;pointer-events:none;overflow:visible`;
  const edgeLayer = `<svg style="${svgStyle}"><defs>${markers}</defs>${els}</svg>`;
  const labelLayer = `<svg style="${svgStyle};z-index:2">${labels}</svg>`;

  const laneNames = ['Customer (WhatsApp)', 'WhatsApp bot / automation', 'Reservation & dining-plan system', 'Restaurant staff — host, events, manager', 'POS, payments & CRM'];
  let lanesHtml = '';
  [0, 1].forEach(b => laneNames.forEach((name, l) => {
    const w = b ? X0 + 17 * P - 20 : CW - 40;
    lanesHtml += `<div style="position:absolute;left:20px;top:${BT[b] + l * LH}px;width:${w}px;height:200px;background:${l % 2 ? '#E3F1E8' : '#F5FAF7'};border-top:1px solid rgba(17,27,33,0.08)"><div style="position:absolute;left:0;top:0;bottom:0;width:112px;border-right:1px solid #128C7E;display:flex;align-items:center;padding:0 12px;box-sizing:border-box;font-size:10.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#075E54;line-height:1.35">${esc(name)}</div></div>`;
  }));
  const phases = [[0, 0, 14, 'Book', 'Stages 1 · 2 · 3 — entry, details, availability'], [0, 15, 18, 'Confirm', 'Stage 4'], [0, 19, 22, 'Manage', 'Stage 5'], [1, 0, 1, 'Dine', 'Stage 6'], [1, 2, 6, 'Pay', 'Stage 7'], [1, 7, 11, 'Feedback', 'Stage 8'], [1, 12, 16, 'Loyalty', 'Stage 9']];
  const phasesHtml = phases.map(([b, c0, c1, name, st]) => `<div style="position:absolute;left:${X0 + c0 * P - 15}px;top:${BT[b] - 42}px;width:${(c1 - c0 + 1) * P - 10}px;height:34px;display:flex;align-items:baseline;gap:10px;padding:0 14px;box-sizing:border-box;border-bottom:2px solid #075E54"><span style="font-family:${SERIF};font-weight:600;font-size:24px;color:#075E54">${name}</span><span style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:#128C7E">${esc(st)}</span></div>`).join('');

  const tt = n => `<div style="font-size:11px;font-weight:600;line-height:1.2">${esc(n.title)}</div><div style="font-size:9px;line-height:1.25;color:#54656F">${esc(n.sub)}</div>`;
  const flex = 'display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-sizing:border-box;gap:2px';
  const nodeHtml = nodes.map(n => {
    let inner = '';
    switch (n.type) {
      case 'cust': inner = `<div style="position:absolute;inset:0;border:1.5px solid ${n.bc};background:${n.bg};border-radius:18px;${flex};padding:5px 10px">${tt(n)}</div>`; break;
      case 'proc': inner = `<div style="position:absolute;inset:0;border:1.3px solid ${n.bc};background:${n.bg};border-radius:3px;${flex};padding:5px 9px">${tt(n)}</div>`; break;
      case 'offline': inner = `<div style="position:absolute;inset:0;border:1.3px dashed ${n.bc};border-radius:3px;${flex};padding:5px 9px"><div style="font-size:11px;font-weight:600;line-height:1.2">${esc(n.title)}</div><div style="font-size:9px;line-height:1.25;color:#54656F;font-style:italic">${esc(n.sub)}</div></div>`; break;
      case 'msg': { const cp = 'clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)';
        inner = `<div style="position:absolute;inset:0;background:${n.bc};${cp}"></div><div style="position:absolute;inset:1.3px;background:${n.bg};${cp};${flex};padding:5px 15px">${tt(n)}</div><div style="position:absolute;right:9px;top:5px;width:7px;height:7px;border-radius:50%;background:#25D366"></div>`; break; }
      case 'dec': { const cp = 'clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)';

function buildPhones() {
  const T = { head: '#075E54', teal: '#128C7E', green: '#25D366', out: '#D9FDD3', bg: '#EFEAE2', ink: '#111B21', mute: '#667781', link: '#027EB5', tick: '#53BDEB' };
  const time = t => `<span style="float:right;margin:4px 0 0 8px;font-size:8.5px;color:${T.mute}">${t}</span>`;
  const tickTime = t => `<span style="float:right;margin:4px 0 0 8px;font-size:8.5px;color:${T.mute}">${t} <span style="color:${T.tick}">✓✓</span></span>`;
  const bub = (side, html, t) => `<div style="align-self:${side === 'in' ? 'flex-start' : 'flex-end'};max-width:80%;background:${side === 'in' ? '#fff' : T.out};border-radius:${side === 'in' ? '2px 9px 9px 9px' : '9px 2px 9px 9px'};padding:6px 8px 4px;font-size:11px;line-height:1.35;color:${T.ink};box-shadow:0 1px 0.5px rgba(11,20,26,0.13)">${html}<div style="overflow:hidden">${side === 'in' ? time(t) : tickTime(t)}</div></div>`;
  const I = (h, t = '19:02') => bub('in', h, t), O = (h, t = '19:03') => bub('out', h, t);
  const btns = a => `<div style="align-self:flex-start;width:80%;display:flex;flex-direction:column;gap:3px;margin-top:-3px">${a.map(b => `<div style="background:#fff;border-radius:9px;text-align:center;padding:7px;font-size:11px;font-weight:500;color:${T.link};box-shadow:0 1px 0.5px rgba(11,20,26,0.13)">${b}</div>`).join('')}</div>`;
  const chip = t => `<div style="align-self:center;background:#E1F2FB;color:${T.mute};font-size:9.5px;padding:3px 9px;border-radius:7px;box-shadow:0 1px 0.5px rgba(11,20,26,0.1)">${t}</div>`;
  const row = (a, b, bold) => `<div style="display:flex;justify-content:space-between;${bold ? 'font-weight:700;border-top:1px solid #dfe5e7;margin-top:3px;padding-top:3px' : ''}"><span>${a}</span><span>${b}</span></div>`;
  const steps = [
    ['Open the chat', [chip('Today'), O('Hi, I’d like to book a table'), I('Welcome to <b>[Restaurant Name]</b>, [Wine Estate] 🍷<br>How can we help you today?'), btns(['Book a table', 'View menu', 'Manage booking']), chip('Type “person” to speak to a host')]],
    ['Date, meal and time', [I('Which date would you like?'), btns(['📅 Pick a date']), O('14/11/2026'), I('Which meal?'), btns(['Breakfast', 'Lunch', 'Dinner']), O('Dinner'), I('Pick a time (last seating 20:30)'), btns(['≡ View times'])]],
    ['Guests and area', [I('How many diners? (1–12)'), O('4'), I('Where would you like to sit?'), btns(['Private', 'Main', 'Mezzanine', 'Alfresco']), O('Alfresco 🌿')]],
    ['Dietary notes and occasion', [I(`Any dietary needs?<br><span style="color:${T.mute}">None · Vegetarian · Vegan · Gluten-free · Allergies</span>`), O('1 vegetarian'), I('Is it a special occasion?'), btns(['Birthday', 'Anniversary', 'No']), O('Anniversary 🎉')]],
    ['Pre-order, optionally', [I('Would you like to pre-order dishes and estate wine pairings?'), btns(['Yes', 'No', 'Decide later']), O('Yes'), I('Choose dishes for each guest, with an optional wine pairing.'), btns(['🍽 Open menu']), O('✔ Pre-order sent')]],
    ['We check and hold', [chip('Checking the dining plan…'), I('Checking availability… ⏳'), I('Good news! <b>Alfresco</b> is free on <b>14/11/2026 at 19:00</b> for 4 guests.<br>We’re holding your table for 10 minutes.')]],
    ['Confirm', [I('<b>Booking summary</b>' + [['Date', '14/11/2026'], ['Time', '19:00'], ['Area', 'Alfresco'], ['Guests', '4'], ['Dietary', '1 vegetarian'], ['Pre-order', 'Yes']].map(([a, b]) => row(a, b)).join('')), btns(['Confirm', 'Change']), O('Confirm'), I('✅ <b>Booking confirmed</b><br>Ref: [REF-0000]<br>📍 [Wine Estate]'), btns(['Add to calendar', 'Manage booking'])]],
    ['Reminders', [chip('Fri 13/11/2026'), I('⏰ Reminder: your table at <b>[Restaurant Name]</b> is tomorrow at 19:00, 4 guests.', '19:00'), chip('Sat 14/11/2026'), I('See you in 2 hours! Need to change anything?', '17:00'), btns(['Manage booking'])]],
    ['Dine', [chip('On site — offline'), I('Welcome! Your table on the Alfresco is ready. Enjoy your evening 🍷', '19:00'), chip('Staff close the bill at the till')]],
    ['Bill and payment', [I('🧾 <b>Your bill</b>' + [['Food', 'R 980.00'], ['Wine pairings', 'R 260.00'], ['Total', 'R 1 240.00']].map(([a, b], i) => row(a, b, i === 2)).join(''), '21:10'), btns(['Pay on WhatsApp', 'Pay at the table']), O('Pay on WhatsApp', '21:11'), I('Add a tip?', '21:11'), btns(['≡ Choose a tip']), O('12.5%', '21:11')]],
    ['Receipt and two questions', [I('✅ Payment received. Receipt: <b>R 1 395.00</b> (incl. tip)', '21:13'), I('How was your experience? (1–5)', '21:13'), O('5 – Excellent', '21:14'), I('Thank you! Please share one thing we did well or can improve.', '21:14'), O('Lovely service 💚', '21:15'), I('Would you leave us a Google review?', '21:15'), btns(['⭐ Leave a review'])]],
    ['Rewards and special days', [I('Join our rewards programme? Reply <b>Stop</b> at any time to unsubscribe.', '21:16'), btns(['Yes', 'No thanks']), O('Yes', '21:16'), I('Welcome 🎉 Want a reminder before special days?', '21:16'), btns(['Yes', 'No']), O('Yes', '21:17'), chip('14 days before'), I('💚 Your anniversary is coming up! Shall we set a table?'), btns(['Book a table'])]],
  ];
  const phone = ([title, msgs], i) => `<div style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <div style="display:flex;align-items:center;gap:10px;align-self:flex-start;margin-left:40px"><div style="width:32px;height:32px;border-radius:50%;background:${T.head};color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center">${i + 1}</div><div style="font-family:${SERIF};font-weight:600;font-size:24px;color:${T.head}">${title}</div></div>
    <div style="position:relative;width:300px;height:620px;border-radius:48px;background:linear-gradient(145deg,#2e2e2e,#0a0a0a 60%,#1c1c1c);padding:9px;box-sizing:border-box;box-shadow:0 0 0 1.5px #3a3a3a inset,0 18px 36px rgba(0,0,0,.35)">
      <div style="position:absolute;left:-3px;top:110px;width:3px;height:30px;background:#1a1a1a;border-radius:2px 0 0 2px"></div><div style="position:absolute;left:-3px;top:160px;width:3px;height:52px;background:#1a1a1a;border-radius:2px 0 0 2px"></div><div style="position:absolute;right:-3px;top:170px;width:3px;height:76px;background:#1a1a1a;border-radius:0 2px 2px 0"></div>
      <div style="position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:${T.bg};display:flex;flex-direction:column">
        <div style="background:${T.head};color:#fff;padding:10px 20px 8px;flex:none"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:600;padding:0 6px"><span>9:41</span><span style="letter-spacing:2px">▂▄▆ ▮</span></div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:20px"><span style="font-size:16px">‹</span><div style="width:30px;height:30px;border-radius:50%;background:${T.green};display:flex;align-items:center;justify-content:center;font-size:14px">🍷</div><div style="line-height:1.2"><div style="font-size:12.5px;font-weight:600">[Restaurant Name] <span style="color:${T.green}">✔</span></div><div style="font-size:9.5px;opacity:.8">Business account</div></div></div></div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;padding:10px 8px;overflow:hidden;background-image:radial-gradient(rgba(7,94,84,.07) 1px,transparent 1px);background-size:14px 14px">${msgs.join('')}</div>
        <div style="flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px 20px;background:${T.bg}"><div style="flex:1;background:#fff;border-radius:18px;padding:7px 12px;font-size:11px;color:${T.mute}">Message</div><div style="width:30px;height:30px;border-radius:50%;background:${T.teal};color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">🎤</div></div>
        <div style="position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:100px;height:4px;border-radius:2px;background:#111"></div>
        <div style="position:absolute;top:9px;left:50%;transform:translateX(-50%);width:84px;height:24px;border-radius:14px;background:#000"></div>
      </div></div></div>`;
  return `<div style="position:relative;width:1700px;height:2560px;background:#F0F7F2;font-family:Inter,system-ui,sans-serif;color:${T.ink};padding:50px 40px;box-sizing:border-box">
    <div style="font-family:${SERIF};font-weight:600;font-size:46px;line-height:1;color:${T.head}">Guest Journey – WhatsApp Reservations</div>
    <div style="font-family:${SERIF};font-style:italic;font-size:22px;margin-top:6px">[Restaurant Name], [Wine Estate] · Phone view: the twelve steps as the guest sees them</div>

function render() {
  const v = $('view').value;
  const dims = v === 'Phone view' ? [1700, 2560, buildPhones] : v === "Owner's view" ? [1600, 1130, buildOwner] : [4330, 2310, () => buildFull($('badges').checked, $('exc').checked)];
  $('stage').innerHTML = dims[2]();
  const z = $('zoom').value / 100;
  $('stage').style.transform = `scale(${z})`;
  $('wrap').style.width = (dims[0] * z) + 'px';
  $('wrap').style.height = (dims[1] * z) + 'px';
}
['view', 'exc', 'badges', 'zoom'].forEach(id => $(id).addEventListener('input', render));
render();
</script>
</body>
</html>
