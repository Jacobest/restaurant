<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<title>EngageONE – Restaurant Booking live chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#F0F7F2;color:#111B21;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{background:#075E54;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
  header b{font-size:18px} header b span{color:#25D366}
  .hl{display:flex;align-items:center;gap:14px}
  .demo{font-size:18px;color:#D9FDD3;padding-left:14px;border-left:1px solid rgba(255,255,255,.35);white-space:nowrap}
  .demo strong{font-weight:700;color:#fff}
  header a{color:#D9FDD3;font-size:14px;text-decoration:none;margin-left:16px}
  .shell{max-width:980px;margin:0 auto;padding:28px 16px 60px;display:grid;grid-template-columns:230px 1fr;gap:32px;align-items:start}
  .steps{position:sticky;top:20px;display:flex;flex-direction:column;gap:4px}
  .steps button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:10px;font:500 14px Inter,sans-serif;color:#44575a;cursor:pointer}
  .steps button span{flex:none;width:24px;height:24px;border-radius:50%;background:#dbe7e1;color:#075E54;font-size:12px;font-weight:700;display:grid;place-items:center}
  .steps button:hover{background:#e3efe8}
  .steps button.on{background:#fff;color:#075E54;box-shadow:0 2px 8px rgba(7,94,84,.15)}
  .steps button.on span{background:#075E54;color:#fff}
  .stage{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:0}
  .now{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:22px;color:#075E54;text-align:center;min-height:28px}
  .phone{position:relative;width:300px;height:clamp(440px,calc(100vh - 170px),620px);border-radius:48px;background:linear-gradient(145deg,#2e2e2e,#0a0a0a 60%,#1c1c1c);padding:9px;box-shadow:0 0 0 1.5px #3a3a3a inset,0 18px 36px rgba(0,0,0,.35)}
  .side{position:absolute;background:#1a1a1a}
  .s1{left:-3px;top:110px;width:3px;height:30px;border-radius:2px 0 0 2px}.s2{left:-3px;top:160px;width:3px;height:52px;border-radius:2px 0 0 2px}.s3{right:-3px;top:170px;width:3px;height:76px;border-radius:0 2px 2px 0}
  .screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#EFEAE2;display:flex;flex-direction:column}
  .top{background:#075E54;color:#fff;padding:10px 20px 8px;flex:none}
  .status{display:flex;justify-content:space-between;font-size:11px;font-weight:600;padding:0 6px}
  .who{display:flex;align-items:center;gap:8px;margin-top:20px}
  .av{width:30px;height:30px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-size:14px}
  #chat{flex:1;display:flex;flex-direction:column;gap:5px;padding:10px 8px;overflow-y:auto;scrollbar-width:none;background-image:radial-gradient(rgba(7,94,84,.07) 1px,transparent 1px);background-size:14px 14px}
  #chat::-webkit-scrollbar{display:none}
  #chat>*{flex:none}
  .bar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px 20px;background:#EFEAE2}
  .inp{flex:1;background:#fff;border-radius:18px;padding:7px 12px;font-size:11px;color:#667781}
  .mic{width:30px;height:30px;border-radius:50%;background:#128C7E;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
  .home{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:100px;height:4px;border-radius:2px;background:#111}
  .notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:84px;height:24px;border-radius:14px;background:#000}
  .pop{animation:pop .28s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  .typing i{width:5px;height:5px;border-radius:50%;background:#9aa7ab;animation:dot 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
  .ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .ctl button{border:0;background:#075E54;color:#fff;border-radius:99px;padding:9px 16px;font:600 13px Inter,sans-serif;cursor:pointer}
  .ctl button:hover{background:#128C7E}
  @media (max-width:760px){
    .shell{grid-template-columns:1fr;gap:12px;padding-top:12px}
    .steps{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
    .steps button{flex:none;white-space:nowrap;padding:6px 10px}
    .stage{min-height:0;padding-top:0}
    
  }
  @media (prefers-reduced-motion:reduce){.pop,.typing i{animation:none}}
  .crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:14px 24px;background:#fff;border-bottom:1px solid #d5e3dc;font-family:inherit;font-weight:600;font-size:17px;line-height:1.2}
  .crumbs[hidden]{display:none}
  .crumbs a{color:#075E54;text-decoration:none}
  .crumbs a:hover{text-decoration:underline}
  .crumbs .back{background:#075E54;color:#fff;padding:8px 14px;border-radius:99px;font-size:15px;margin-right:6px}
  .crumbs .back:hover{background:#128C7E;text-decoration:none}
  .crumbs .sep{color:#8aa39b;font-weight:400}
  .crumbs .cur{color:#111B21}
  @media (max-width:600px){.crumbs{padding:12px 16px;font-size:16px}}
</style>
</head>
<body>
<header><div class="hl"><b>Engage<span>ONE</span></b><span class="demo">Restaurant <strong>Demo</strong></span></div><span><a href="/logout">Sign out</a></span></header>
<nav class="crumbs" aria-label="Breadcrumb" id="crumbs" hidden><a class="back" href="/uc/restaurant-booking/">‹ Back</a><a href="/uc/">Use cases</a> <span class="sep">›</span> <a href="/uc/restaurant-booking/">Restaurant Booking</a> <span class="sep">›</span> <span class="cur">Live chat</span></nav>
<div id="root"></div>
<script>fetch("/api/me").then(r=>r.json()).then(d=>{if(!d.role)document.querySelector("header>span").remove();else document.getElementById("crumbs").hidden=false}).catch(()=>{})</script>
<script>
const SERIF = "'Cormorant Garamond',Georgia,serif";
function buildPhones() {
  const T = { head: '#075E54', teal: '#128C7E', green: '#25D366', out: '#D9FDD3', bg: '#EFEAE2', ink: '#111B21', mute: '#667781', link: '#027EB5', tick: '#53BDEB' };
  const time = t => `<span style="float:right;margin:4px 0 0 8px;font-size:8.5px;color:${T.mute}">${t}</span>`;
  const tickTime = t => `<span style="float:right;margin:4px 0 0 8px;font-size:8.5px;color:${T.mute}">${t} <span style="color:${T.tick}">✓✓</span></span>`;
  const bub = (side, html, t) => `<div style="align-self:${side === 'in' ? 'flex-start' : 'flex-end'};max-width:80%;background:${side === 'in' ? '#fff' : T.out};border-radius:${side === 'in' ? '2px 9px 9px 9px' : '9px 2px 9px 9px'};padding:6px 8px 4px;font-size:11px;line-height:1.35;color:${T.ink};box-shadow:0 1px 0.5px rgba(11,20,26,0.13)">${html}<div style="overflow:hidden">${side === 'in' ? time(t) : tickTime(t)}</div></div>`;
  const I = (h, t = '19:02') => bub('in', h, t), O = (h, t = '19:03') => bub('out', h, t);
  const btns = a => `<div style="align-self:flex-start;width:80%;display:flex;flex-direction:column;gap:3px;margin-top:-3px">${a.map(b => `<div style="background:#fff;border-radius:9px;text-align:center;padding:7px;font-size:11px;font-weight:500;color:${T.link};box-shadow:0 1px 0.5px rgba(11,20,26,0.13)">${b}</div>`).join('')}</div>`;
  const chip = t => `<div style="align-self:center;background:#E1F2FB;color:${T.mute};font-size:9.5px;padding:3px 9px;border-radius:7px;box-shadow:0 1px 0.5px rgba(11,20,26,0.1)">${t}</div>`;
  const row = (a, b, bold) => `<div style="display:flex;justify-content:space-between;${bold ? 'font-weight:700;border-top:1px solid #dfe5e7;margin-top:3px;padding-top:3px' : ''}"><span>${a}</span><span>${b}</span></div>`;
  const steps = [
    ['Open the chat', [chip('Today'), O('Hi, I’d like to book a table'), I('Welcome to <b>Florentine’s Bistro</b>, [Wine Estate] 🍷<br>How can we help you today?'), btns(['Book a table', 'View menu', 'Manage booking']), chip('Type “person” to speak to a host')]],
    ['Date, meal and time', [I('Which date would you like?'), btns(['📅 Pick a date']), O('14/11/2026'), I('Which meal?'), btns(['Breakfast', 'Lunch', 'Dinner']), O('Dinner'), I('Pick a time (last seating 20:30)'), btns(['≡ View times'])]],
    ['Guests and area', [I('How many diners? (1–12)'), O('4'), I('Where would you like to sit?'), btns(['Private', 'Main', 'Mezzanine', 'Alfresco']), O('Alfresco 🌿')]],
    ['Dietary notes and occasion', [I(`Any dietary needs?<br><span style="color:${T.mute}">None · Vegetarian · Vegan · Gluten-free · Allergies</span>`), O('1 vegetarian'), I('Is it a special occasion?'), btns(['Birthday', 'Anniversary', 'No']), O('Anniversary 🎉')]],
    ['Pre-order, optionally', [I('Would you like to pre-order dishes and estate wine pairings?'), btns(['Yes', 'No', 'Decide later']), O('Yes'), I('Choose dishes for each guest, with an optional wine pairing.'), btns(['🍽 Open menu']), O('✔ Pre-order sent')]],
    ['We check and hold', [chip('Checking the dining plan…'), I('Checking availability… ⏳'), I('Good news! <b>Alfresco</b> is free on <b>14/11/2026 at 19:00</b> for 4 guests.<br>We’re holding your table for 10 minutes.')]],
    ['Confirm', [I('<b>Booking summary</b>' + [['Date', '14/11/2026'], ['Time', '19:00'], ['Area', 'Alfresco'], ['Guests', '4'], ['Dietary', '1 vegetarian'], ['Pre-order', 'Yes']].map(([a, b]) => row(a, b)).join('')), btns(['Confirm', 'Change']), O('Confirm'), I('✅ <b>Booking confirmed</b><br>Ref: [REF-0000]<br>📍 [Wine Estate]'), btns(['Add to calendar', 'Manage booking'])]],
    ['Reminders', [chip('Fri 13/11/2026'), I('⏰ Reminder: your table at <b>Florentine’s Bistro</b> is tomorrow at 19:00, 4 guests.', '19:00'), chip('Sat 14/11/2026'), I('See you in 2 hours! Need to change anything?', '17:00'), btns(['Manage booking'])]],
    ['Dine', [chip('On site — offline'), I('Welcome! Your table on the Alfresco is ready. Enjoy your evening 🍷', '19:00'), chip('Staff close the bill at the till')]],
    ['Bill and payment', [I('🧾 <b>Your bill</b>' + [['Food', 'R 980.00'], ['Wine pairings', 'R 260.00'], ['Total', 'R 1 240.00']].map(([a, b], i) => row(a, b, i === 2)).join(''), '21:10'), btns(['Pay on WhatsApp', 'Pay at the table']), O('Pay on WhatsApp', '21:11'), I('Add a tip?', '21:11'), btns(['≡ Choose a tip']), O('12.5%', '21:11')]],
    ['Receipt and two questions', [I('✅ Payment received. Receipt: <b>R 1 395.00</b> (incl. tip)', '21:13'), I('How was your experience? (1–5)', '21:13'), O('5 – Excellent', '21:14'), I('Thank you! Please share one thing we did well or can improve.', '21:14'), O('Lovely service 💚', '21:15'), I('Would you leave us a Google review?', '21:15'), btns(['⭐ Leave a review'])]],
    ['Rewards and special days', [I('Join our rewards programme? Reply <b>Stop</b> at any time to unsubscribe.', '21:16'), btns(['Yes', 'No thanks']), O('Yes', '21:16'), I('Welcome 🎉 Want a reminder before special days?', '21:16'), btns(['Yes', 'No']), O('Yes', '21:17'), chip('14 days before'), I('💚 Your anniversary is coming up! Shall we set a table?'), btns(['Book a table'])]],
  ];

  // ---- Auto-playing single phone ----
  const typingHTML = `<div class="typing" style="align-self:flex-start;background:#fff;border-radius:2px 9px 9px 9px;padding:9px 11px;box-shadow:0 1px 0.5px rgba(11,20,26,0.13);display:flex;gap:3px"><i></i><i></i><i></i></div>`;
  const kindOf = html => html.includes('align-self:flex-end') ? 'out' : html.includes('max-width:80%') ? 'in' : html.includes('width:80%') ? 'btn' : html.includes('align-self:center') ? 'chip' : 'in';
  const flat = [];
  steps.forEach(([title, msgs], si) => { flat.push({ kind: 'step', si, title }); msgs.forEach(h => flat.push({ kind: kindOf(h), html: h, si })); });

  window.__flat = flat; window.__typing = typingHTML;
  const phoneShell = `
    <div class="phone"><div class="side s1"></div><div class="side s2"></div><div class="side s3"></div>
      <div class="screen">
        <div class="top"><div class="status"><span>9:41</span><span style="letter-spacing:2px">▂▄▆ ▮</span></div>
          <div class="who"><span style="font-size:16px">‹</span><div class="av">🍷</div><div style="line-height:1.2"><div style="font-size:12.5px;font-weight:600">Florentine’s Bistro <span style="color:${T.green}">✔</span></div><div id="presence" style="font-size:9.5px;opacity:.8">Business account</div></div></div></div>
        <div id="chat"></div>
        <div class="bar"><div class="inp">Message</div><div class="mic">🎤</div></div>
        <div class="home"></div><div class="notch"></div>
      </div></div>`;

  return `
  <div class="shell">
    <aside class="steps" id="steps">${steps.map(([t], i) => `<button data-i="${i}"><span>${i + 1}</span>${t}</button>`).join('')}</aside>
    <section class="stage">
      <div class="now" id="now">Scroll down or press play</div>
      ${phoneShell}
      <div class="ctl">
        <button id="play" aria-label="Play or pause">⏸ Pause</button>
        <button id="restart">↺ Restart</button>
        <button id="speed">Speed 0.5×</button>
      </div>
    </section>
  </div>`;
}

document.getElementById('root').innerHTML = buildPhones();

(function () {
  const flat = window.__flat, typingHTML = window.__typing;
  const chat = document.getElementById('chat'), now = document.getElementById('now');
  const stepBtns = [...document.querySelectorAll('#steps button')];
  const playBtn = document.getElementById('play'), speedBtn = document.getElementById('speed'), presence = document.getElementById('presence');
  let run = 0, paused = false, speed = 0.5, started = false, pos = 0;
  const sleep = ms => new Promise(r => setTimeout(r, ms / speed));
  const toBottom = () => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
  const tpl = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

  function setStep(si) {
    stepBtns.forEach((b, i) => b.classList.toggle('on', i === si));
    now.textContent = `Step ${si + 1} of ${stepBtns.length} · ${stepBtns[si].textContent.replace(/^\d+/, '')}`;
  }
  function add(item, instant) {
    const el = tpl(item.html);
    if (!instant) el.classList.add('pop');
    chat.appendChild(el);
    return el;
  }
  async function waitIfPaused(id) { while (paused && id === run) await sleep(150); }

  async function play(from) {
    const id = ++run; pos = from;
    chat.innerHTML = '';
    // jump: show everything before `from` instantly
    for (let i = 0; i < from; i++) { const it = flat[i]; if (it.kind === 'step') setStep(it.si); else add(it, true); }
    chat.scrollTop = chat.scrollHeight;
    for (; pos < flat.length; pos++) {
      if (id !== run) return;
      await waitIfPaused(id); if (id !== run) return;
      const it = flat[pos];
      if (it.kind === 'step') {
        setStep(it.si);
        if (it.si > 0) { await sleep(1400); if (id !== run) return; }
        continue;
      }
      if (it.kind === 'in') {
        presence.textContent = 'typing…';
        const t = tpl(typingHTML); chat.appendChild(t); toBottom();
        await sleep(650 + Math.min(900, it.html.length * 1.2)); if (id !== run) return;
        t.remove(); presence.textContent = 'Business account';
      } else if (it.kind === 'out') {
        await sleep(900); if (id !== run) return;
      } else if (it.kind === 'btn') {
        await sleep(250); if (id !== run) return;
      } else { await sleep(500); if (id !== run) return; }
      add(it); toBottom();
      await sleep(it.kind === 'btn' ? 700 : 450);
    }
    if (id === run) { now.textContent = 'End of the journey · press Restart to watch again'; playBtn.textContent = '▶ Play'; paused = true; }
  }

  function begin(from) { started = true; paused = false; playBtn.textContent = '⏸ Pause'; play(from); }
  const firstOf = si => flat.findIndex(f => f.kind === 'step' && f.si === si);

  playBtn.onclick = () => {
    if (!started) return begin(0);
    if (pos >= flat.length) return begin(0);
    paused = !paused; playBtn.textContent = paused ? '▶ Play' : '⏸ Pause';
  };
  document.getElementById('restart').onclick = () => begin(0);
  speedBtn.onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 0.5 : 1; speedBtn.textContent = `Speed ${speed}×`; };
  stepBtns.forEach((b, i) => b.onclick = () => begin(firstOf(i)));

  // Start by itself when the phone scrolls into view.
  const io = new IntersectionObserver(es => { if (!started && es.some(e => e.isIntersecting)) { io.disconnect(); begin(0); } }, { threshold: 0.25 });
  io.observe(document.querySelector('.phone'));
})();
</script>
</body>
</html>
