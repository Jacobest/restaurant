<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<title>EngageONE – Sign in</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#EFEAE2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111B21}
  .card{width:min(92vw,380px);background:#fff;border-radius:16px;padding:32px 28px;box-shadow:0 8px 30px rgba(7,94,84,.15)}
  .logo{width:48px;height:48px;border-radius:50%;background:#25D366;display:grid;place-items:center;margin-bottom:16px}
  h1{margin:0 0 6px;font-size:22px;color:#075E54}
  p{margin:0 0 20px;color:#667781;font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:12px;border:1px solid #cfd8d6;border-radius:8px;font-size:16px}
  input:focus{outline:2px solid #128C7E;border-color:transparent}
  button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#075E54;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  button:hover{background:#128C7E}
  .err{display:none;margin-top:14px;color:#b3261e;font-size:14px}
  .err.show{display:block}
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg></div>
    <h1>Engage<span style="color:#25D366">ONE</span></h1>
    <p>Sign in to see the use cases.</p>
    <input type="hidden" name="next" id="next">
    <label for="em">Email</label>
    <input id="em" name="email" type="email" autocomplete="username" required autofocus style="margin-bottom:14px">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err" id="err">Wrong email or password. Try again.</div>
  </form>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.has('error')) document.getElementById('err').classList.add('show');
    document.getElementById('next').value = q.get('next') || '';
  </script>
</body>
</html>
